const INV_MAX=60;
function rollItem(stageIdx,boss){
  const w=boss?[25,45,24,6]:[68,23,8,1]; w[2]+=stageIdx*.6; w[3]+=stageIdx*.25;
  let x=R()*w.reduce((a,b)=>a+b,0), r=0; for(;r<3;r++){ x-=w[r]; if(x<=0) break; }
  const keys=Object.keys(ITEM).filter(k=>r===3||!ITEM[k].leg); const b=keys[(R()*keys.length)|0], it=ITEM[b], lv=stageIdx+1;
  const st={}, mul=()=>RM[r]*(1+lv*.05)*(.8+R()*.4);
  const add=k=>{ st[k]=+((st[k]||0)+GSTAT[k].b*mul()).toFixed(GSTAT[k].pct?3:1); };
  const main=MAIN[it.s]||["xp","mag","cd","area"][(R()*4)|0]; add(main);
  const pool=Object.keys(GSTAT).filter(k=>k!==main); for(let i=0;i<r;i++){ const k=pool.splice((R()*pool.length)|0,1)[0]; add(k); }
  if(it.leg) for(const k in it.leg) st[k]=+((st[k]||0)+it.leg[k]).toFixed(3);
  return { u:0, b, r, lv, st, en:0 };
}
function addInv(it){ save.inv=save.inv||[]; save.uid=save.uid||1; it.u=save.uid++;
  if(save.inv.length>=INV_MAX){ const eqd=Object.values(save.eq||{}); const low=[...save.inv].filter(i=>!eqd.includes(i.u)).sort((a,b)=>a.r-b.r||a.lv-b.lv)[0]; if(low){ salvage(low.u); } }
  save.inv.push(it); }
function itemVal(it){ return Math.round([3,8,20,60][it.r]*(1+it.lv*.2)); }
function salvage(u){ const i=save.inv.findIndex(x=>x.u===u); if(i<0) return 0; const v=itemVal(save.inv[i]); save.inv.splice(i,1); for(const k in save.eq) if(save.eq[k]===u) delete save.eq[k]; save.gold=(save.gold||0)+v; return v; }
function gearStats(){ const g={}; for(const sl of SLOTS){ const u=(save.eq||{})[sl]; const it=(save.inv||[]).find(i=>i.u===u); if(!it) continue; for(const k in it.st) g[k]=(g[k]||0)+it.st[k]; } return g; }
function statLine(st){ return Object.keys(GSTAT).filter(k=>st[k]).map(k=>{ const d=GSTAT[k]; return d.pct?`${d.n} +${(st[k]*100).toFixed(1).replace(/\.0$/,"")}%`:`${d.n} +${Math.round(st[k]*10)/10}${d.per||""}`; }).join("、"); }

function auInit(){
  if(AU.ctx) { if(AU.ctx.state==="suspended") AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext||window.webkitAudioContext; AU.ctx = new C();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = save.muted?0:0.55; AU.master.connect(AU.ctx.destination);
    AU.bgm = AU.ctx.createGain(); AU.bgm.gain.value = 0.16; AU.bgm.connect(AU.master);
    const n = AU.ctx.sampleRate; AU.noise = AU.ctx.createBuffer(1,n,n); const d = AU.noise.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    setInterval(bgmTick, 60);

}
function tone(f,dur,type,vol,f2,delay,out){ const c=AU.ctx, t=c.currentTime+(delay||0); const o=c.createOscillator(), g=c.createGain(); o.type=type||"square"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(out||AU.master); o.start(t); o.stop(t+dur+.02); }
function noise(dur,vol,freq,delay,q){ const c=AU.ctx, t=c.currentTime+(delay||0); const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=freq||2000; if(q) f.Q.value=q; const g=c.createGain();

const BGM_ROOT = [0,-2,3,-5,2,5,-4,1,-1,-3];

function bgmTick(){
  if(!AU.ctx||save.muted||mode!=="play"||!G) return;
  const spb=60/(128+G.stage*4)/2, c=AU.ctx;
  if(AU.next<c.currentTime) AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.2){
    const base=110*Math.pow(2,BGM_ROOT[G.stage]/12), s=AU.step, d=AU.next-c.currentTime;
    tone(base*Math.pow(2,BASS[s%8]/12),spb*.9,"triangle",.5,0,d,AU.bgm);

function ellipsePts(cx,cy,rx,ry,n,rand,j){ const p=[]; const o=rand()*6.28; for(let i=0;i<n;i++){ const a=o+i/n*6.283; const k=1+(rand()-.5)*j; p.push([cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]); } return p; }

function spawnTick(dt){

  while(G.spawnAcc>=1){

function hitEnemy(e,dmg,kx,ky){

function updateEnemies(dt){
  const p=G.p;
  for(const e of G.enemies){
    if(e.dead) continue;
    e.t+=dt; e.flash-=dt; e.slow-=dt;
    let dx=p.x-e.x, dy=p.y-e.y; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
    let sp=e.spd*(e.slow>0?.4:1);
    if(e.dashT>0){ e.dashT-=dt; dx=e.ldx; dy=e.ldy; sp=e.dashT>.55?0:e.spd*5.5; }
    if(e.frozen>0){ e.frozen-=dt; sp=0; }
    if(e.beh==="line"){ e.x+=e.vx*sp*1.1*dt; e.y+=e.vy*sp*1.1*dt; e.life-=dt; if(e.life<=0) e.dead=true; }
    else {
      if(e.beh==="dash"){ const c=e.t%3.2; if(c>2.5) sp*=3.2; else if(c>2.1) sp*=.15; }
      if(e.beh==="shoot" && e.t>2.6){ e.t=0; if(L<520) G.ebullets.push({ x:e.x, y:e.y, vx:dx*170, vy:dy*170, r:9, dmg:e.dmg*.8, life:4, txt:e.d.shot }); }
      if(e.beh==="boss"&&!(e.frozen>0)) bossAI(e);
      e.x+=dx*sp*dt; e.y+=dy*sp*dt;
    }
    e.x+=e.kx*dt; e.y+=e.ky*dt; e.kx*=Math.pow(.02,dt); e.ky*=Math.pow(.02,dt);
    const vr=viewRadius(); if(!e.boss && e.beh!=="line" && L>vr*1.7){ const a=Math.atan2(p.fy||R()-.5,p.fx||R()-.5)+(R()-.5)*1.4; e.x=p.x+Math.cos(a)*(vr+40); e.y=p.y+Math.sin(a)*(vr+40); }
    e.ft+=dt*(sp/60)*3; if(e.ft>1){ e.ft-=1; e.frame^=1; }
  }
  for(const a of grid.values()){ const n=Math.min(a.length,10); for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ const A=a[i],B=a[j]; const dx=B.x-A.x, dy=B.y-A.y, rr=(A.r+B.r)*.8, d2=dx*dx+dy*dy; if(d2<rr*rr&&d2>0.01){ const d=Math.sqrt(d2), push=(rr-d)*.5/d; if(!A.boss){ A.x-=dx*push; A.y-=dy*push; } if(!B.boss){ B.x+=dx*push; B.y+=dy*push; } } } }
}
function bossAI(e){
  const b=e.d, enr=e.hp<e.maxHp*.5;
  if(enr&&!e.enraged){ e.enraged=true; e.spd*=1.3; G.shake=.6; showMsg("BOSS 暴怒！","血剩一半，攻擊變快"); say(e,"你真的要告我？？",3); sfx("boss"); }
  if(e.t>(enr?2.1:3.0)){ e.t=0; e.ph++;
    if(e.ph%3===2){ const dx=G.p.x-e.x, dy=G.p.y-e.y, L=Math.hypot(dx,dy)||1; e.ldx=dx/L; e.ldy=dy/L; e.dashT=1.05; return; } // 衝撞：先停 0.5 秒（地上有紅線警告）再衝
    if(e.ph%3===1){ const n=Math.round((10+G.stage*2)*(enr?1.6:1)); const o=R()*6.28; for(let i=0;i<n;i++){ const a=o+i/n*6.283; G.ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*150, vy:Math.sin(a)*150, r:11, dmg:b.dmg*.6, life:5, txt:b.shot }); } if(enr) setTimeout(()=>{ if(!G||e.dead) return; const o2=R()*6.28; for(let i=0;i<n;i++){ const a=o2+i/n*6.283; G.ebullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*190, vy:Math.sin(a)*190, r:11, dmg:b.dmg*.6, life:5, txt:b.shot }); } },350);
      sfx("shoot"); }
    else { for(let i=0;i<(6+G.stage)*(enr?1.5:1);i++){ const t=b.summon[(R()*b.summon.length)|0]; const a=R()*6.28; spawnEnemy(t,e.x+Math.cos(a)*e.r*1.3,e.y+Math.sin(a)*e.r*1.3); } }
  }
}

// ---------------- 武器（等級 1～5，6＝超進化） ----------------
function wpar(id,lv){ const s=stat(), A=s.area, P=s.proj, E=lv>=6;
  switch(id){
    case "briefcase": return { n:(E?6:[2,2,3,3,4][lv-1])+P, rad:(E?125:72+lv*7)*A, dmg:E?70:15+lv*5, hr:E?34:16 };
    case "silence":   return { cd:1.0*s.cd, r:(E?210:62+lv*16)*A, dmg:E?30:5+lv*3 };
    case "letter":    return { cd:(E?.25:Math.max(.45,1.25-lv*.12))*s.cd, n:(E?6:1+Math.floor(lv/2))+P, dmg:E?45:18+lv*5, pierce:E?3:lv>=5?2:1 };
    case "orange":    return { cd:(E?.7:1.6)*s.cd, n:(E?5:lv>=5?3:lv>=3?2:1)+P, r:(E?130:58+lv*9)*A, dmg:E?90:24+lv*9 };
    case "autohunt":  return { cd:(E?.08:Math.max(.18,.55-lv*.07))*s.cd, n:E?4:lv>=4?2:1, dmg:E?22:8+lv*3.5 };
    case "ticket":    return { cd:(E?.8:1.2)*s.cd, n:(E?7:[1,2,2,3,3][lv-1])+P, dmg:E?55:15+lv*5, big:E };
    case "card":      return { cd:(E?.6:1.1)*s.cd, n:E?24:2+lv+P, dmg:E?30:10+lv*3, pierce:E?3:lv>=4?2:1, all:E };
    case "beam":      return { n:E?4:lv>=3?2:1, len:(E?380:150+lv*28)*A, dmg:E?35:10+lv*4 };
    case "stamp":     return { cd:(E?1.0:2.4)*s.cd, n:(E?2:1)+Math.floor(P/2), r:(E?170:70+lv*10)*A, dmg:E?160:40+lv*12 };
    case "trail":     return { cd:.22, r:(E?48:26+lv*4)*A, life:E?4:2+lv*.3, dmg:E?20:6+lv*3 };
    case "eraser":    return { cd:(E?2.5:4.5)*s.cd, h:(E?210:60+lv*16)*A, dmg:E?120:30+lv*10 };
    case "chain":     return { cd:(E?.5:Math.max(.6,1.6-lv*.15))*s.cd, n:(E?12:2+lv)+P, dmg:E?50:20+lv*6 };
    case "block":     return { cd:(E?2.0:3.2)*s.cd, r:(E?300:120+lv*20)*A, dmg:E?45:10+lv*5, kb:E?900:500 };
    case "call":      return { cd:(E?1.0:2.0)*s.cd, arc:E?Math.PI:.9, r:(E?270:150+lv*20)*A, dmg:E?40:14+lv*5 };
    case "snap":      return { cd:(E?1.8:3.4-lv*.25)*s.cd, w:(150+lv*22)*A, h:(100+lv*15)*A, dmg:E?55:20+lv*7, full:E };
    case "report":    return { cd:(E?.7:Math.max(.7,1.5-lv*.12))*s.cd, n:(E?8:1+Math.floor(lv/3))+P, dmg:E?40:14+lv*5 };
    case "dmca":      return { cd:(E?.55:1.9-lv*.16)*s.cd, n:(E?4:1+Math.floor(lv/3))+P, dmg:E?75:26+lv*8, r:(E?115:55+lv*7)*A };
    case "undo":      return { cd:(E?3.0:7-lv*.5)*s.cd, r:(E?280:110+lv*18)*A, dmg:E?55:16+lv*6 };
    case "star":      return { cd:(E?.12:Math.max(.25,.75-lv*.09))*s.cd, r:(E?52:30+lv*4)*A, dmg:E?42:14+lv*5, n:E?2:1 };
  } }
function fireWeapons(dt){
  const p=G.p;
  for(const id in G.weapons){
    CUR=id; const nb=G.bullets.length;
    const lv=G.weapons[id], w=wpar(id,lv); G.wt[id]-=dt; const ready=G.wt[id]<=0 && id!=="trail"; if(ready&&w.cd) G.wt[id]=w.cd;
    switch(id){
      case "briefcase": { G.orbAng+=dt*3.2;
        for(let i=0;i<w.n;i++){ const a=G.orbAng+i/w.n*6.283, x=p.x+Math.cos(a)*w.rad, y=p.y+Math.sin(a)*w.rad*.6;
          query(x,y,w.hr,e=>{ if((e.hitT.bc||0)<G.t){ e.hitT.bc=G.t+.45; hitEnemy(e,w.dmg,Math.cos(a)*160,Math.sin(a)*160); } }); }
        break; }
      case "silence": if(ready){ query(p.x,p.y,w.r,e=>{ hitEnemy(e,w.dmg,0,0); }); G.fx.push({ k:"ring", x:p.x, y:p.y, r:w.r, t:.35 }); } break;
      case "letter": if(ready){ for(let i=0;i<w.n;i++) G.bullets.push({ k:"letter", x:p.x, y:p.y, vx:(R()-.5)*200, vy:-120-R()*80, sp:330, dmg:w.dmg, r:10, life:3, pierce:w.pierce, homing:true }); sfx("shoot"); } break;
      case "orange": if(ready){ for(let i=0;i<w.n;i++){ const tg=nearest(p.x+(R()-.5)*260,p.y+(R()-.5)*260,360); const tx=tg?tg.x:p.x+(R()-.5)*300, ty=tg?tg.y:p.y+(R()-.5)*300;
          G.bullets.push({ k:"orange", sx:p.x, sy:p.y, tx, ty, t:0, T:.6, r:w.r, dmg:w.dmg }); } } break;
      case "autohunt": if(ready){ for(let i=0;i<w.n;i++){ const a=G.t*1.5+i*6.283/w.n, x=p.x+Math.cos(a)*48, y=p.y+Math.sin(a)*16; const tg=nearest(x,y,400);
          if(tg){ const dx=tg.x-x, dy=tg.y-y, L=Math.hypot(dx,dy)||1; G.bullets.push({ k:"pew", x, y, vx:dx/L*520, vy:dy/L*520, dmg:w.dmg, r:5, life:1, pierce:1 }); } } } break;
      case "ticket": if(ready){ const base=Math.atan2(p.fy,p.fx); for(let i=0;i<w.n;i++){ const a=base+(i-(w.n-1)/2)*(w.big?.9:.45); G.bullets.push({ k:"ticket", x:p.x, y:p.y, vx:Math.cos(a)*460, vy:Math.sin(a)*460, t:0, dmg:w.dmg, r:w.big?22:13, life:2.2, pierce:999, boomer:true, big:w.big }); } sfx("shoot"); } break;
      case "card": if(ready){ const base=Math.atan2(p.fy,p.fx); for(let i=0;i<w.n;i++){ const a=w.all? i/w.n*6.283 : base+(i-(w.n-1)/2)*.17; G.bullets.push({ k:"card", x:p.x, y:p.y, vx:Math.cos(a)*440, vy:Math.sin(a)*440, dmg:w.dmg, r:8, life:.75, pierce:w.pierce, rot:a }); } sfx("shoot"); } break;
      case "beam": { G.beamAng+=dt*2.3; for(let i=0;i<w.n;i++){ const a=G.beamAng+i*6.283/w.n, cx=Math.cos(a), cy=Math.sin(a)*.6;
          for(let d=30; d<=w.len; d+=26) query(p.x+cx*d,p.y+cy*d,13,e=>{ if((e.hitT.bm||0)<G.t){ e.hitT.bm=G.t+.28; hitEnemy(e,w.dmg,cx*80,cy*80); } }); } break; }
      case "stamp": if(ready){ for(let i=0;i<w.n;i++){ const tg=nearest(p.x+(R()-.5)*300,p.y+(R()-.5)*300,380); const x=tg?tg.x:p.x+(R()-.5)*260, y=tg?tg.y:p.y+(R()-.5)*260;
          G.bullets.push({ k:"stamp", x, y, t:0, T:.38, r:w.r, dmg:w.dmg }); } } break;
      case "trail": { if(p.moving){ p.moved+=dt; if(p.moved>=w.cd){ p.moved=0; G.fires.push({ x:p.x, y:p.y, r:w.r, life:w.life, max:w.life, dmg:w.dmg, tick:0 }); } } break; }
      case "eraser": if(ready){ const vw=W/ZOOM/2+80; G.sweeps.push({ x0:p.x-vw, x1:p.x+vw, x:p.x-vw, y:p.y, h:w.h, dmg:w.dmg, hit:new Set() }); sfx("erase"); } break;
      case "chain": if(ready){ let from={x:p.x,y:p.y}; const hit=new Set(), pts=[[p.x,p.y-30]];
          for(let i=0;i<w.n;i++){ const tg=nearest(from.x,from.y,i?170:400,hit); if(!tg) break; hit.add(tg); hitEnemy(tg,w.dmg,0,0); pts.push([tg.x,tg.y-tg.r]); from=tg; }
          if(pts.length>1){ G.fx.push({ k:"zap", pts, t:.18 }); sfx("zap"); } } break;
      case "block": if(ready){ G.fx.push({ k:"block", x:p.x, y:p.y, r:w.r, t:.4 }); query(p.x,p.y,w.r,e=>{ const dx=e.x-p.x, dy=e.y-p.y, L=Math.hypot(dx,dy)||1; hitEnemy(e,w.dmg,dx/L*w.kb,dy/L*w.kb); }); sfx("boom"); } break;
      case "snap": if(ready){ let x=p.x, y=p.y, ww=w.w, hh=w.h; if(w.full){ ww=W/ZOOM; hh=H/ZOOM; } else { const tg=nearest(p.x,p.y,420); if(tg){ x=tg.x; y=tg.y; } }
          for(const e of [...G.enemies]){ if(!e.dead && Math.abs(e.x-x)<ww/2 && Math.abs(e.y-y)<hh/2){ e.frozen=Math.max(e.frozen||0,.7); hitEnemy(e,w.dmg,0,0); } }
          G.fx.push({ k:"snap", x, y, w:ww, h:hh, t:.4 }); sfx("snap"); } break;
      case "report": if(ready){ const tg=nearest(p.x,p.y,500); const base=tg?Math.atan2(tg.y-p.y,tg.x-p.x):Math.atan2(p.fy,p.fx);
          for(let i=0;i<w.n;i++){ const a=w.n>=8? i/w.n*6.283 : base+(i-(w.n-1)/2)*.3; G.bullets.push({ k:"flag", x:p.x, y:p.y, vx:Math.cos(a)*520, vy:Math.sin(a)*520, dmg:w.dmg, r:13, life:1.3, pierce:999, hitk:"rp" }); } sfx("shoot"); } break;
      case "dmca": if(ready){ for(let i=0;i<w.n;i++){ const a=R()*6.283; G.bullets.push({ k:"dmca", x:p.x, y:p.y, vx:Math.cos(a)*220, vy:Math.sin(a)*220, sp:340, dmg:w.dmg, r:10, br:w.r, life:3.2, pierce:1, homing:true }); } sfx("shoot"); } break;
      case "undo": if(ready){ const vr=viewRadius(); query(p.x,p.y,w.r,e=>{ hitEnemy(e,w.dmg,0,0); if(!e.dead&&!e.boss){ const a=R()*6.283; e.x=p.x+Math.cos(a)*(vr+30); e.y=p.y+Math.sin(a)*(vr+30); e.kx=e.ky=0; } });
          G.fx.push({ k:"undo", x:p.x, y:p.y, r:w.r, t:.45 }); sfx("erase"); } break;
      case "star": if(ready){ for(let i=0;i<w.n;i++){ const hw=W/ZOOM/2, hh=H/ZOOM/2; let x=p.x+(R()-.5)*hw*1.8, y=p.y+(R()-.5)*hh*1.6; const tg=nearest(x,y,160); if(tg){ x=tg.x; y=tg.y; }
          G.bullets.push({ k:"star", x, y, t:0, T:.42, r:w.r, dmg:w.dmg }); } } break;
      case "call": if(ready){ const base=Math.atan2(p.fy,p.fx); G.fx.push({ k:"call", x:p.x, y:p.y, a:base, arc:w.arc, r:w.r, t:.45 });
          query(p.x,p.y,w.r,e=>{ let da=Math.atan2(e.y-p.y,e.x-p.x)-base; da=Math.atan2(Math.sin(da),Math.cos(da)); if(Math.abs(da)<=w.arc){ e.slow=1.5; hitEnemy(e,w.dmg,Math.cos(base)*120,Math.sin(base)*120); } }); sfx("ring"); } break;
    }
    for(let i=nb;i<G.bullets.length;i++) if(!G.bullets[i].src) G.bullets[i].src=id;
  }
}
function updateBullets(dt){
  const p=G.p;
  for(const b of G.bullets){
    if(b.dead) continue; CUR=b.src||"?";
    if(b.k==="orange"){ b.t+=dt; if(b.t>=b.T){ b.dead=true; G.fx.push({ k:"boom", x:b.tx, y:b.ty, r:b.r, t:.35 }); sfx("boom"); query(b.tx,b.ty,b.r,e=>{ const dx=e.x-b.tx, dy=e.y-b.ty, L=Math.hypot(dx,dy)||1; hitEnemy(e,b.dmg,dx/L*220,dy/L*220); }); } continue; }
    if(b.k==="star"){ b.t+=dt; if(b.t>=b.T){ b.dead=true; G.fx.push({ k:"star", x:b.x, y:b.y, r:b.r, t:.3 }); query(b.x,b.y,b.r,e=>{ hitEnemy(e,b.dmg,0,0); }); } continue; }
    if(b.k==="stamp"){ b.t+=dt; if(b.t>=b.T){ b.dead=true; G.marks.push({ x:b.x, y:b.y, r:b.r, t:1.2 }); G.shake=Math.max(G.shake,.3); sfx("stamp"); query(b.x,b.y,b.r,e=>{ hitEnemy(e,b.dmg,0,0); }); } continue; }
    b.life-=dt; if(b.life<=0){ b.dead=true; continue; }
    if(b.homing){ const tg=nearest(b.x,b.y,420); if(tg){ const dx=tg.x-b.x, dy=tg.y-b.y, L=Math.hypot(dx,dy)||1; b.vx+=(dx/L*b.sp-b.vx)*Math.min(1,dt*5); b.vy+=(dy/L*b.sp-b.vy)*Math.min(1,dt*5); } }
    if(b.boomer){ b.t+=dt; if(b.t>.45){ const dx=p.x-b.x, dy=p.y-b.y, L=Math.hypot(dx,dy)||1; b.vx+=dx/L*1500*dt; b.vy+=dy/L*1500*dt; if(b.t>.7&&L<24) b.dead=true; } }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    query(b.x,b.y,b.r,e=>{
      if(b.k==="dmca"){ b.dead=true; G.fx.push({ k:"boom", x:b.x, y:b.y, r:b.br, t:.35, txt:"DMCA" }); sfx("boom"); query(b.x,b.y,b.br,q=>{ const dx=q.x-b.x, dy=q.y-b.y, L=Math.hypot(dx,dy)||1; hitEnemy(q,b.dmg,dx/L*200,dy/L*200); }); return false; }
      if(b.hitk){ if((e.hitT[b.hitk]||0)>G.t) return; e.hitT[b.hitk]=G.t+.5; }
      if(b.boomer){ if((e.hitT.tk||0)>G.t) return; e.hitT.tk=G.t+.4; }
      const L=Math.hypot(b.vx,b.vy)||1; hitEnemy(e,b.dmg,b.vx/L*120,b.vy/L*120); b.pierce--; if(b.pierce<=0){ b.dead=true; return false; } });
  }
  G.bullets=G.bullets.filter(b=>!b.dead);
  CUR="trail"; for(const f of G.fires){ f.life-=dt; f.tick-=dt; if(f.tick<=0){ f.tick=.4; query(f.x,f.y,f.r,e=>{ hitEnemy(e,f.dmg,0,0); }); } }
  G.fires=G.fires.filter(f=>f.life>0);
  CUR="eraser"; for(const s of G.sweeps){ const nx=s.x+(s.x1-s.x0)*dt/.6; for(const e of G.enemies){ if(e.dead||s.hit.has(e)) continue; if(Math.abs(e.y-s.y)<s.h/2 && e.x>=s.x-30 && e.x<=nx+30){ s.hit.add(e); hitEnemy(e,s.dmg,0,0); } } s.x=nx; if(s.x>=s.x1) s.done=true; }
  G.sweeps=G.sweeps.filter(s=>!s.done);
  for(const m of G.marks) m.t-=dt; G.marks=G.marks.filter(m=>m.t>0);
  for(const b of G.ebullets){ b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.life<=0) b.dead=true;
    else if(dist2(b.x,b.y,p.x,p.y)<(b.r+14)*(b.r+14)){ b.dead=true; hurtPlayer(b.dmg); } }
  G.ebullets=G.ebullets.filter(b=>!b.dead);
}

// ---------------- 玩家 ----------------
function hurtPlayer(d){ const p=G.p; if(p.inv>0||mode!=="play") return; d*=1-stat().armor; p.hp-=d; p.inv=.6; G.shake=Math.max(G.shake,.25); sfx("hurt"); if(p.hp<=0){ p.hp=0; endGame(false); } }
function updatePlayer(dt){
  const p=G.p, s=stat(); let mx=0,my=0;
  if(keys["a"]||keys["arrowleft"]) mx--; if(keys["d"]||keys["arrowright"]) mx++; if(keys["w"]||keys["arrowup"]) my--; if(keys["s"]||keys["arrowdown"]) my++;
  if(joy.on){ const dx=joy.x-joy.ox, dy=joy.y-joy.oy, L=Math.hypot(dx,dy); if(L>8){ const k=Math.min(1,L/50); mx=dx/L*k; my=dy/L*k; } }
  const L=Math.hypot(mx,my); if(L>0){ const k=L>1?1/L:1; mx*=k; my*=k; p.fx=mx; p.fy=my; if(Math.abs(mx)>.1) p.face=mx>0?1:-1; }
  p.x+=mx*HERO_SPEED*s.spd*dt; p.y+=my*HERO_SPEED*s.spd*dt; p.moving=L>0;
  p.inv-=dt; if(s.regen) p.hp=Math.min(p.maxHp,p.hp+s.regen*dt);
  let worst=0; query(p.x,p.y,14,e=>{ if(e.dmg>worst) worst=e.dmg; }); if(worst>0) hurtPlayer(worst);
  if(mode!=="play") return;
  const mag=95*s.mag;
  for(const g of G.gems){ const d2=dist2(g.x,g.y,p.x,p.y); if(g.pull||d2<mag*mag){ g.pull=true; const d=Math.sqrt(d2)||1; const sp=Math.max(260,520-d); g.x+=(p.x-g.x)/d*sp*dt; g.y+=(p.y-g.y)/d*sp*dt; if(d<16){ g.dead=true; gainXp(g.v); sfx("gem"); } } }
  G.gems=G.gems.filter(g=>!g.dead);
  for(const k of G.pickups){ if(dist2(k.x,k.y,p.x,p.y)<30*30){ k.dead=true; sfx("pick");
    if(k.k==="coffee"){ p.hp=Math.min(p.maxHp,p.hp+30); G.texts.push({ x:p.x, y:p.y-60, t:1, s:"+30 ☕" }); }
    else if(k.k==="item"){ G.loot.push(k.it); G.texts.push({ x:p.x, y:p.y-80, t:1.8, s:`撿到【${RAR[k.it.r].n}】${ITEM[k.it.b].n}` }); if(k.it.r>=2) sfx("evo"); }
    else { for(const g of G.gems) g.pull=true; G.texts.push({ x:p.x, y:p.y-60, t:1, s:"全部吸過來" }); } } }
  G.pickups=G.pickups.filter(k=>!k.dead);
}
function gainXp(v){ G.xp+=v*stat().xp; if(G.xp>=G.xpNeed && mode==="play"){ G.xp-=G.xpNeed; G.lv++; G.xpNeed=Math.round(3+G.lv*2.1+Math.pow(G.lv,1.28)); levelUp(); } }

// ---------------- 升級（四選一，可以超進化） ----------------
function levelUp(){
  sfx("lvl");
  const evos=[], opts=[]; const owned=Object.keys(G.weapons);
  for(const id of owned){ const ev=WEAPONS[id].evo; if(G.weapons[id]===MAX_WLV && ev && G.passives[ev[0]]) evos.push({ k:"evo", id }); }
  for(const id in WEAPONS){ const lv=G.weapons[id]||0; if(lv>=MAX_WLV) continue; if(!lv && owned.length>=MAX_WEAPONS) continue; if(id==="beam" && !lv && !save.origin && G.hero.id!=="origin") continue; opts.push({ k:"w", id, lv }); }
  for(const id in PASSIVES){ const lv=G.passives[id]||0; if(lv<(PASSIVES[id].max||MAX_PLV)) opts.push({ k:"p", id, lv }); }
  for(let i=opts.length-1;i>0;i--){ const j=(R()*(i+1))|0; [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const pick=[...evos.slice(0,1),...opts].slice(0,4);
  if(!pick.length) pick.push({ k:"heal" });
  mode="levelup"; joy.on=false;
  ui.innerHTML=`<div class="screen"><h2>升級！Lv ${G.lv}</h2><div class="sub">四選一</div>${pick.map((o,i)=>{
    if(o.k==="heal") return `<button class="choice" data-i="${i}">喝杯咖啡<small>回 40 血</small></button>`;
    if(o.k==="evo"){ const ev=WEAPONS[o.id].evo; return `<button class="choice evo" data-i="${i}">超進化：${ev[1]} <span class="tag">${WEAPONS[o.id].name}＋${PASSIVES[ev[0]].name}</span><small>${ev[2]}</small></button>`; }

// ---------------- 主迴圈 ----------------
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode==="play" && G) step(dt);
  draw();
  requestAnimationFrame(frame);
}
function step(dt){
  G.t+=dt;
  if(!G.bossSpawned && G.t>=STAGE_TIME) spawnBoss();
  buildGrid(); spawnTick(dt); updatePlayer(dt); if(mode!=="play") return;
  updateEnemies(dt); buildGrid(); fireWeapons(dt); updateBullets(dt); updateTalk(dt); if(G.ultFx){ G.ultFx.t-=dt; if(G.ultFx.t<=0) G.ultFx=null; }
  G.enemies=G.enemies.filter(e=>!e.dead);
  for(const f of G.fx){ f.t-=dt; if(f.vx){ f.x+=f.vx*dt; f.y+=f.vy*dt; } } G.fx=G.fx.filter(f=>f.t>0);
  for(const t of G.texts){ t.t-=dt; t.y-=40*dt; } G.texts=G.texts.filter(t=>t.t>0);
  if(G.msg){ G.msg.t-=dt; if(G.msg.t<=0) G.msg=null; }
  G.shake=Math.max(0,G.shake-dt);
}

    else if(f.k==="spark"){ ctx.fillStyle="#d6322b"; ctx.fillRect(f.x-3,f.y-3,6,6); }
    else if(f.k==="zap"){ ctx.lineJoin="round"; for(let pass=0;pass<2;pass++){ ctx.strokeStyle=pass?"#222":"#ffe14d"; ctx.lineWidth=pass?2:6; ctx.beginPath(); ctx.moveTo(f.pts[0][0],f.pts[0][1]); for(let i=1;i<f.pts.length;i++){ const [a,b]=f.pts[i-1],[c,d]=f.pts[i]; ctx.lineTo((a+c)/2+(R()-.5)*30,(b+d)/2+(R()-.5)*30); ctx.lineTo(c,d); } ctx.stroke(); }
      label(ctx,"傳票",f.pts[1][0],f.pts[1][1]-20,14,"#3a4ad5"); }
    else if(f.k==="block"){ const r=f.r*(1-f.t*1.6+.36); ctx.strokeStyle="rgba(214,50,43,"+Math.min(1,f.t*2)+")"; ctx.lineWidth=8; ctx.beginPath(); ctx.ellipse(f.x,f.y,Math.max(1,r),Math.max(1,r*.6),0,0,7); ctx.stroke(); ctx.globalAlpha=Math.min(1,f.t*2.5); label(ctx,"封鎖",f.x,f.y-r*.6-12,20,"#d6322b"); ctx.globalAlpha=1; }
    else if(f.k==="snap"){ ctx.globalAlpha=Math.min(1,f.t*2.5); ctx.fillStyle="rgba(255,255,255,.55)"; ctx.fillRect(f.x-f.w/2,f.y-f.h/2,f.w,f.h); ctx.lineWidth=5; ctx.strokeStyle="#222"; ctx.strokeRect(f.x-f.w/2,f.y-f.h/2,f.w,f.h); label(ctx,"已截圖",f.x,f.y-f.h/2-12,16,"#d6322b"); ctx.globalAlpha=1; }
    else if(f.k==="undo"){ ctx.strokeStyle="rgba(58,123,213,"+Math.min(1,f.t*2)+")"; ctx.lineWidth=5; const r=f.r*(1.15-f.t); ctx.beginPath(); ctx.ellipse(f.x,f.y,r,r*.6,0,0,7); ctx.stroke(); ctx.globalAlpha=Math.min(1,f.t*2.5); label(ctx,"Ctrl+Z 復原",f.x,f.y-r*.6-14,18,"#3a7bd5"); ctx.globalAlpha=1; }
    else if(f.k==="star"){ ctx.globalAlpha=Math.min(1,f.t*3); ctx.fillStyle="rgba(255,211,77,.6)"; ctx.beginPath(); ctx.ellipse(f.x,f.y,f.r,f.r*.5,0,0,7); ctx.fill(); label(ctx,"一星",f.x,f.y-16,14,"#d6322b"); ctx.globalAlpha=1; }
    else if(f.k==="call"){ ctx.strokeStyle="rgba(58,123,213,"+Math.min(1,f.t*2)+")"; ctx.lineWidth=4; for(let i=1;i<=3;i++){ const r=f.r*(i/3)*(1.2-f.t); ctx.beginPath(); ctx.ellipse(f.x,f.y,r,r*.6,0,f.a-f.arc,f.a+f.arc); ctx.stroke(); }
      ctx.globalAlpha=Math.min(1,f.t*3); label(ctx,"轉接中…",f.x+Math.cos(f.a)*f.r*.6,f.y+Math.sin(f.a)*f.r*.35-30,15,"#3a7bd5"); ctx.globalAlpha=1; }
  }
}
function bar(x,y,w,h,k,col,bg){ ctx.fillStyle=bg||"rgba(255,255,255,.8)"; ctx.fillRect(x,y,w,h); ctx.fillStyle=col; ctx.fillRect(x,y,w*clamp(k,0,1),h); ctx.lineWidth=2.5; ctx.strokeStyle="#222"; ctx.strokeRect(x,y,w,h); }
function drawHud(){
  const top=8;
  bar(10,top,W-20-110,12,G.xp/G.xpNeed,"#3a7bd5");
  label(ctx,`Lv ${G.lv}`,36,top+30,16);
  const rem=Math.max(0,STAGE_TIME-G.t), mm=Math.floor(rem/60), ss=Math.floor(rem%60);
  label(ctx,G.bossSpawned?"BOSS 戰":`${mm}:${String(ss).padStart(2,"0")}`,W/2,top+32,22,G.bossSpawned?"#d6322b":"#222");
  label(ctx,`擊倒 ${G.kills}`,48,top+52,13);
  bar(12,top+64,72,8,G.ult,"#d6322b"); label(ctx,G.ult>=1?(G.ultCd>0?"冷卻中":"必殺！"):"必殺",G.ult>=1&&G.ultCd>0?106:100,top+68,11,"#d6322b");
  if(G.ultFx){ const f=G.ultFx, k=f.t/1.5; ctx.globalAlpha=Math.min(1,f.t*2); label(ctx,f.txt,W/2,H*.42,clamp(W/7,40,96)*(1+(1-k)*.15),f.col,"#fff"); ctx.globalAlpha=1; }
  if(G.boss){ const b=G.boss; bar(W*.15,top+50,W*.7,14,b.hp/b.maxHp,"#7a3b5c"); label(ctx,b.d.name,W/2,top+57,13,"#fff","#222"); }
  if(G.msg){ const a=Math.min(1,G.msg.t*2); ctx.globalAlpha=a; label(ctx,G.msg.a,W/2,H*.3,clamp(W/12,26,46),"#222"); label(ctx,G.msg.b,W/2,H*.3+42,clamp(W/26,14,22),"#d6322b"); ctx.globalAlpha=1; }
  if(joy.on){ ctx.strokeStyle="rgba(34,34,34,.35)"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(joy.ox,joy.oy,50,0,7); ctx.stroke(); const dx=joy.x-joy.ox, dy=joy.y-joy.oy, L=Math.hypot(dx,dy), k=L>50?50/L:1; ctx.fillStyle="rgba(34,34,34,.3)"; ctx.beginPath(); ctx.arc(joy.ox+dx*k,joy.oy+dy*k,20,0,7); ctx.fill(); }
}
let menuT=0;
function drawMenuBg(){ menuT+=.016; ctx.fillStyle="#f4efe1"; ctx.fillRect(0,0,W,H);
  const keysE=Object.keys(ENEMIES); for(let i=0;i<30;i++){ const s=SPR[keysE[i%keysE.length]]; const x=((i*173+menuT*30*(i%3+1))%(W+200))-100, y=(i*97)%H; ctx.globalAlpha=.4; ctx.drawImage(s.frames[(Math.floor(menuT*3)+i)%2],x,y,s.w,s.h); } ctx.globalAlpha=1; }

// ---------------- 選單 ----------------
function heroCanvas(id){ const s=HSPR[id]; return `<canvas width="${s.w}" height="${s.h}" data-hero="${id}"></canvas>`; }
function paintHeroCanvases(){ ui.querySelectorAll("canvas[data-hero]").forEach(c=>{ c.getContext("2d").drawImage(HSPR[c.dataset.hero].frames[0],0,0,c.width,c.height); }); }
function showTitle(){
  G=null; mode="menu"; pauseBtn.style.display="none"; muteBtn.style.display="block";
  ui.innerHTML=`<div class="screen"><h1>抄襲<span>倖存者</span></h1><div class="sub">所有人都在抄倖存者，那就讓被抄的人來打。</div>
    <button class="red" id="go">開始</button><button id="bag">背包</button><button id="code">存檔碼</button><div class="note">電腦：WASD／方向鍵移動，P 暫停　手機：按住畫面拖曳<br>全部手繪、故意很醜。本作是諷刺搞笑，角色與現實人物無關（大概）。<br>v1.4　作者：<a href="${YT_URL}" target="_blank" rel="noopener">科技貓 TechCat</a></div></div>`;
  document.getElementById("go").onclick=showHeroes; document.getElementById("bag").onclick=()=>showBag(showTitle); document.getElementById("code").onclick=showCode;
}
function showHeroes(){
  ui.innerHTML=`<div class="screen"><h2>創建角色</h2><input id="nm" class="nm" maxlength="8" value="${(save.name||"").replace(/"/g,"")}" placeholder="取個名字（抄別人的也行）"><div class="sub">選外型：角色只差在長相、台詞和必殺，強不強看裝備${save.title?`<br>頭銜：「${save.title}」`:""}</div><div class="grid">${HEROES.map(h=>{ const lock=h.hidden&&!save.origin;
    return `<div class="card ${lock?"locked":""} ${selHero===h.id?"sel":""}" data-id="${h.id}">${lock?`<canvas width="72" height="80"></canvas><b>？？？</b><small>打完最後一關解鎖</small>`:`${heroCanvas(h.id)}<b>${h.name}</b><small>${h.desc}<br>招牌技能：${WEAPONS[h.weapon].name}<br>必殺：「${h.ult.name}」</small>`}</div>`; }).join("")}</div>
    <button id="back">返回</button><button class="red" id="next">選關卡</button></div>`;
  paintHeroCanvases();
  const keepName=()=>{ save.name=(document.getElementById("nm").value||"").trim().slice(0,8); save.look=selHero; store.set(save); };
  ui.querySelectorAll(".card").forEach(c=>c.onclick=()=>{ if(c.classList.contains("locked")) return; keepName(); selHero=c.dataset.id; showHeroes(); });
  document.getElementById("back").onclick=()=>{ keepName(); showTitle(); }; document.getElementById("next").onclick=()=>{ keepName(); showStages(); };
}
function showStages(){
  const open=i=>i<save.stage;
  ui.innerHTML=`<div class="screen"><h2>選關卡</h2><div class="grid">${STAGES.map((s,i)=>`<div class="card ${open(i)?"":"locked"}" data-i="${i}"><b>${i+1}. ${open(i)?s.name:"？？？"}</b><small>${open(i)?s.sub:"打完上一關解鎖"}${save.best[i]?`<br>✔ 已通關`:""}</small></div>`).join("")}</div>
    <button id="back">返回</button><button id="bag2">背包（換裝備）</button></div>`;
  document.getElementById("bag2").onclick=()=>showBag(showStages);
  ui.querySelectorAll(".card").forEach(c=>c.onclick=()=>{ const i=+c.dataset.i; if(open(i)) newGame(i); });
  document.getElementById("back").onclick=showHeroes;
}
function showPause(){
  ui.innerHTML=`<div class="screen"><h2>暫停</h2><div class="sub">${G.st.name}｜Lv ${G.lv}｜擊倒 ${G.kills}</div>
    <div class="note" style="text-align:left">${Object.entries(G.weapons).map(([k,v])=>v>=6?`<b>${WEAPONS[k].evo[1]}</b>`:`${WEAPONS[k].name} Lv${v}`).join("、")}<br>${Object.entries(G.passives).map(([k,v])=>`${PASSIVES[k].name} Lv${v}`).join("、")||""}</div>
    <button class="red" id="res">繼續</button><button id="quit">放棄這關</button></div>`;
  document.getElementById("res").onclick=togglePause; document.getElementById("quit").onclick=()=>{ showTitle(); };
}
function showBag(back){ const inv=save.inv||[], eq=save.eq||{}, eqd=Object.values(eq), find=u=>inv.find(i=>i.u===u);
  const slots=SLOTS.map(sl=>{ const it=find(eq[sl]); return `<div class="card ${it?"":"locked"}" data-u="${it?it.u:""}"><small style="text-align:center">${SLOTN[sl]}</small>${it?itemHtml(it):`<b style="opacity:.5">（空）</b><small style="text-align:center">裸奔中</small>`}</div>`; }).join("");
  const list=[...inv].sort((a,b)=>b.r-a.r||b.lv-a.lv).map(it=>`<div class="card ${eqd.includes(it.u)?"sel":""}" data-u="${it.u}">${itemHtml(it)}</div>`).join("");
  ui.innerHTML=`<div class="screen"><h2>背包</h2><div class="sub">金幣 ${save.gold||0}（第三批拿來買卷軸）｜${inv.length}/${INV_MAX} 件<br>目前加成：${statLine(gearStats())||"沒有（裸奔中）"}</div>
    <div class="grid">${slots}</div><div class="sub">點裝備可以穿上或回收；紅框是穿著的</div><div class="grid">${list||"<small>空的。去打怪吧，裝備會自己掉。</small>"}</div>
    <button id="bk">返回</button><button id="junk">一鍵回收「路邊撿的」</button></div>`;
  ui.querySelectorAll(".card[data-u]").forEach(c=>c.onclick=()=>{ const u=+c.dataset.u; if(u) showItem(u,back); });
  document.getElementById("bk").onclick=back;
  document.getElementById("junk").onclick=()=>{ let g=0; for(const it of [...save.inv]) if(it.r===0&&!Object.values(save.eq).includes(it.u)) g+=salvage(it.u); store.set(save); showBag(back); if(g) toast(`回收了一堆垃圾，金幣 +${g}`); };
}
function showItem(u,back){ const it=save.inv.find(i=>i.u===u); if(!it) return showBag(back); const I=ITEM[it.b], on=save.eq[I.s]===u;
  ui.innerHTML=`<div class="screen"><h2>${SLOTN[I.s]}</h2><div class="card" style="max-width:240px;margin:0 auto;cursor:default">${itemHtml(it)}<small style="margin-top:6px">「${I.d}」</small></div>
    <button class="red" id="wear">${on?"脫下":"穿上"}</button><button id="sell">回收（金幣 +${itemVal(it)}）</button><button id="bk">返回</button></div>`;
  document.getElementById("wear").onclick=()=>{ if(on) delete save.eq[I.s]; else save.eq[I.s]=u; store.set(save); showBag(back); };
  document.getElementById("sell").onclick=()=>{ const g=salvage(u); store.set(save); showBag(back); toast(`回收了，金幣 +${g}`); };
  document.getElementById("bk").onclick=()=>showBag(back);
}
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }
function showCode(){ const code="CHAOSI1:"+btoa(unescape(encodeURIComponent(JSON.stringify(save))));
  ui.innerHTML=`<div class="screen"><h2>存檔碼</h2><div class="sub">換手機、清瀏覽器之前先複製起來，貼回來就能還原。<br>（這串亂碼就是你的全部身家，不要被抄走）</div>
    <textarea id="cd" class="code" readonly>${code}</textarea><button class="red" id="cp">複製</button>
    <div class="sub" style="margin-top:12px">還原：把存檔碼貼在下面（會蓋掉現在的進度）</div><textarea id="in" class="code" placeholder="貼上存檔碼"></textarea>
    <button id="rs">還原</button><button id="bk">返回</button></div>`;
  document.getElementById("cp").onclick=()=>{ const ta=document.getElementById("cd"); ta.select(); (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast("已複製"),()=>{ try{ document.execCommand("copy"); toast("已複製"); }catch(e){ toast("請自己長按複製"); } }); };
  document.getElementById("rs").onclick=()=>{ try{ const v=document.getElementById("in").value.trim(); if(!v.startsWith("CHAOSI1:")) throw 0; const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(8))))); if(!o||typeof o!=="object"||!o.stage) throw 0;
      save=Object.assign(SAVE_DEF(),o); store.set(save); selHero=save.look||"mr"; toast("還原成功"); showTitle(); } catch(e){ toast("這不是存檔碼（抄錯了嗎？）"); } };
  document.getElementById("bk").onclick=showTitle;
}
function donateHtml(){
  const big=`<span>我就是要贊助</span><small>本貓不喝咖啡，只收錢。</small>`;
  return DONATE_URL?`<a href="${DONATE_URL}" target="_blank" rel="noopener" style="text-decoration:none"><button class="donate-big">${big}</button></a>`:`<button class="donate-big" disabled>${big}</button>`;
}
function endGame(win){
  if(mode==="over") return; mode="over"; pauseBtn.style.display="none"; joy.on=false; sfx(win?"win":"lose");
  const goldGain=Math.round(G.kills/8+(win?30+G.stage*15:0)); save.gold=(save.gold||0)+goldGain; for(const it of G.loot) addInv(it); store.set(save);
  let extra="";
  if(win){ save.best[G.stage]=true; if(G.stage+2>save.stage) save.stage=Math.min(STAGES.length,G.stage+2);
    if(G.stage===STAGES.length-1 && !save.origin){ save.origin=true; extra=`<p><b>解鎖隱藏角色：倖存者始祖！</b><br>原來大家抄的，都是他的玩法。</p>`; }
    store.set(save); }
  const hasNext=win && G.stage<STAGES.length-1;
  ui.innerHTML=`<div class="screen"><h2>${win?"打爆了！":"你被抄走了…"}</h2>
    <div class="sub">${G.name}（${G.hero.name}）｜${G.st.name}｜撐了 ${Math.floor(G.t)} 秒｜Lv ${G.lv}｜擊倒 ${G.kills}</div>
    ${win?`<p><b>${G.name}</b> 打倒了 <b>${BOSSES[G.st.boss].name}</b></p>`:""}
    ${dmgTable()}
    <div class="note" style="text-align:left;opacity:.9">這局拿到：金幣 +${goldGain}${G.loot.length?G.loot.map(it=>`<br><b style="color:${RAR[it.r].c}">【${RAR[it.r].n}】${ITEM[it.b].n}</b> <small>${statLine(it.st)}</small>`).join(""):"<br>裝備：沒有（運氣也是實力的一部分）"}<br><small>已放進背包，去背包穿上。</small></div>
    ${win?(G.stage===STAGES.length-1?`<p>「第一份」被打倒了。<br>正版先生看了一眼，還是一句話都沒說。</p>`:""):`<p>${["抄襲者太多了。","你被留言淹沒了。","對方說：好玩就好。"][(R()*3)|0]}</p>`}
    ${extra}
    ${donateHtml()}
    <div class="donate-sub">別人說「不收贊助，但歡迎請喝咖啡」。我們不演，直接說：本遊戲收贊助。<br>
      贊助可獲得：<b>沒屁用的頭銜</b>一個。不會變強、不加攻擊，連顏色都不會變。<br>我們查不到誰有贊助，所以頭銜<b>靠良心自己領</b>。<br>
      <button class="mini" id="ttl">${save.title?`已領「${save.title}」（良心還好嗎）`:"我贊助了，領頭銜"}</button></div>
    ${hasNext?`<button class="mini" id="next">下一關</button>`:""}<button class="mini" id="menu">回標題</button><a href="${YT_URL}" target="_blank" rel="noopener"><button class="mini">看科技貓頻道</button></a></div>`;
  const s=G.stage;
  if(hasNext) document.getElementById("next").onclick=()=>newGame(s+1);
  document.getElementById("menu").onclick=showTitle;
  document.getElementById("ttl").onclick=e=>{ save.title="自稱有贊助的人"; store.set(save); e.target.textContent=`已領「${save.title}」（良心還好嗎）`; };
}
function dmgTable(){ const rows=Object.entries(G.dmgBy).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]); const tot=rows.reduce((a,r)=>a+r[1],0)||1;
  if(!rows.length) return ""; return `<div class="note" style="text-align:left;opacity:.85">傷害統計：${rows.slice(0,6).map(([k,v])=>`<br>${k==="ult"?"必殺「"+G.hero.ult.name+"」":(WEAPONS[k]?(G.weapons[k]>=6?WEAPONS[k].evo[1]:WEAPONS[k].name):"其他")}　${Math.round(v)}（${Math.round(v/tot*100)}%）`).join("")}</div>`; }

showTitle();
requestAnimationFrame(frame);
</script>
